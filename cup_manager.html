<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>גביע הרחוב - מנהל הקבוצה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#134d2e;
    --pitch:#1f7a4d;
    --pitch-light:#2fa968;
    --bg:#f2f7ef;
    --ink:#12261a;
    --card:#ffffff;
    --line:#d8ead9;
    --gold:#ffc93c;
    --red:#e6484f;
    --muted:#6b8072;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #2fa96833, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Rubik', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:18px 12px 40px;
  }
  h1,h2,h3, .headline{
    font-family:'Baloo 2', sans-serif;
    margin:0;
  }
  .app{
    width:100%;
    max-width:460px;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .topbar .headline{
    font-size:22px;
    font-weight:800;
    color:var(--pitch-dark);
  }
  .topbar .headline span{color:var(--gold); -webkit-text-stroke:0.6px var(--pitch-dark);}
  .subtitle{font-size:13px; color:var(--muted);}

  /* progress rail */
  .rail{
    display:flex;
    gap:6px;
    margin-bottom:18px;
  }
  .rail-step{
    flex:1;
    height:8px;
    border-radius:6px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .rail-step.done{background:var(--pitch-light);}
  .rail-step.current{background:var(--gold);}

  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 6px 0 var(--line);
  }
  .hidden{display:none !important;}

  /* player grid */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .player{
    border:2px solid var(--line);
    border-radius:16px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    background:#fbfdfa;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    user-select:none;
  }
  .player:active{transform:scale(0.96);}
  .player.selected{
    border-color:var(--pitch);
    background:#e9f7ee;
  }
  .player .emoji{font-size:30px;}
  .player .name{font-family:'Baloo 2'; font-weight:700; font-size:15px; margin-top:4px;}
  .player .pos{font-size:11px; color:var(--muted); margin-bottom:6px;}
  .stat-row{display:flex; justify-content:center; gap:8px; font-size:11px;}
  .stat{padding:2px 6px; border-radius:8px; font-weight:700;}
  .stat.atk{background:#fde3d0; color:#b4460a;}
  .stat.def{background:#dcebfa; color:#1b4d8c;}

  .pick-count{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    font-weight:500;
  }

  button.primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:16px;
    background:var(--pitch);
    color:#fff;
    font-family:'Baloo 2';
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 0 var(--pitch-dark);
    margin-top:8px;
  }
  button.primary:disabled{
    background:#b7c9bd;
    box-shadow:0 5px 0 #99a89e;
    cursor:not-allowed;
  }
  button.primary:active:not(:disabled){transform:translateY(3px); box-shadow:0 2px 0 var(--pitch-dark);}
  button.secondary{
    width:100%;
    padding:12px;
    border:2px solid var(--pitch);
    border-radius:16px;
    background:transparent;
    color:var(--pitch-dark);
    font-family:'Baloo 2';
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
  }

  input#teamName{
    width:100%;
    padding:12px 14px;
    border-radius:14px;
    border:2px solid var(--line);
    font-family:'Rubik';
    font-size:16px;
    text-align:center;
    margin-top:6px;
  }

  /* bracket */
  .bracket{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bracket-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:14px;
    border:2px solid var(--line);
    background:#fbfdfa;
  }
  .bracket-item.won{border-color:var(--pitch-light); background:#e9f7ee;}
  .bracket-item.now{border-color:var(--gold); background:#fff8e6;}
  .bracket-item .num{
    width:26px; height:26px; border-radius:50%;
    background:var(--pitch-dark); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2'; font-size:13px; flex-shrink:0;
  }
  .bracket-item.won .num{background:var(--pitch-light);}
  .bracket-item .info{flex:1;}
  .bracket-item .team{font-family:'Baloo 2'; font-weight:700; font-size:14px;}
  .bracket-item .round-label{font-size:11px; color:var(--muted);}
  .bracket-item .badge{font-size:20px;}

  /* match screen */
  .versus{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:10px 0 4px;
  }
  .side{text-align:center; flex:1;}
  .side .crest{font-size:40px; display:block;}
  .side .tname{font-family:'Baloo 2'; font-weight:700; font-size:14px; margin-top:2px;}
  .score{
    font-family:'Baloo 2';
    font-size:34px;
    font-weight:800;
    min-width:90px;
    text-align:center;
    color:var(--pitch-dark);
  }
  .clock{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .pitch{
    position:relative;
    width:100%;
    height:190px;
    margin:10px 0 12px;
    border-radius:12px;
    border:3px solid #fff;
    overflow:hidden;
    background:
      repeating-linear-gradient(90deg, var(--pitch-light) 0 34px, var(--pitch) 34px 68px);
  }
  .pitch .center-line{
    position:absolute; left:50%; top:0; bottom:0; width:2px;
    background:rgba(255,255,255,.75); transform:translateX(-50%);
  }
  .pitch .center-circle{
    position:absolute; left:50%; top:50%; width:52px; height:52px;
    border:2px solid rgba(255,255,255,.75); border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .pitch .goal-box{
    position:absolute; top:32%; width:12px; height:36%;
    border:2px solid rgba(255,255,255,.85);
  }
  .pitch .goal-box.left{left:0; border-left:none;}
  .pitch .goal-box.right{right:0; border-right:none;}
  .dot{
    position:absolute;
    width:22px; height:22px;
    margin-left:-11px; margin-top:-11px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-family:'Baloo 2'; font-weight:700;
    box-shadow:0 2px 3px rgba(0,0,0,.3);
    animation:idle 2.4s ease-in-out infinite alternate;
  }
  .dot.mine{background:var(--gold); color:var(--pitch-dark);}
  .dot.opp{background:#fff; color:var(--red); border:2px solid var(--red);}
  .dot.bounce{animation:bounce .6s ease;}
  @keyframes idle{
    from{transform:translateY(0);}
    to{transform:translateY(-4px);}
  }
  @keyframes bounce{
    0%{transform:translateY(0) scale(1);}
    35%{transform:translateY(-16px) scale(1.2);}
    65%{transform:translateY(0) scale(1);}
    100%{transform:scale(1);}
  }
  .ball{
    position:absolute;
    width:15px; height:15px;
    margin-left:-7.5px; margin-top:-7.5px;
    border-radius:50%;
    background:#fff;
    border:2px solid #1b2a1e;
    left:50%; top:50%;
    transition:left .8s ease, top .8s ease;
  }
  .goal-text{
    position:absolute;
    top:10px;
    font-family:'Baloo 2'; font-weight:800; font-size:15px;
    color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.45);
    opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .goal-text.show{opacity:1;}
  .goal-text.left{left:10px;}
  .goal-text.right{right:10px;}

  .commentary{
    background:var(--pitch-dark);
    color:#eaf6ee;
    border-radius:14px;
    padding:10px 12px;
    height:150px;
    overflow-y:auto;
    font-size:13px;
    display:flex;
    flex-direction:column-reverse;
    gap:6px;
  }
  .commentary div{opacity:0; animation:fadein .4s forwards;}
  @keyframes fadein{to{opacity:1;}}
  .goal-flash{animation:pop .5s ease;}
  @keyframes pop{
    0%{transform:scale(1);}
    30%{transform:scale(1.25); color:var(--gold);}
    100%{transform:scale(1);}
  }

  .result-banner{
    text-align:center;
    padding:14px;
    border-radius:16px;
    margin-top:10px;
    font-family:'Baloo 2';
    font-size:18px;
    font-weight:800;
  }
  .result-banner.win{background:#e9f7ee; color:var(--pitch-dark);}
  .result-banner.lose{background:#fdeaea; color:var(--red);}

  .trophy-screen{text-align:center;}
  .trophy-screen .big{font-size:70px;}
  .confetti-wrap{position:relative; height:0;}
  .confetti{
    position:fixed; top:-20px; font-size:20px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.9;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="headline">גביע ה<span>רחוב</span> ⚽</div>
  </div>
  <div class="subtitle" id="subtitle" style="margin-bottom:10px;">בנה קבוצה, נצח ארבעה יריבים, הרם את הגביע</div>

  <div class="rail" id="rail">
    <div class="rail-step" data-i="0"></div>
    <div class="rail-step" data-i="1"></div>
    <div class="rail-step" data-i="2"></div>
    <div class="rail-step" data-i="3"></div>
  </div>

  <!-- SCREEN 1: team name -->
  <div class="card" id="screen-name">
    <h2>איך קוראים לקבוצה שלך?</h2>
    <input id="teamName" placeholder="לדוגמה: הברקים" maxlength="18">
    <button class="primary" id="btnNameNext">המשך לבחירת שחקנים</button>
  </div>

  <!-- SCREEN 2: draft -->
  <div class="card hidden" id="screen-draft">
    <h2>בחר 5 שחקנים לקבוצה</h2>
    <div class="subtitle">חלוצים טובים בהתקפה, מגנים טובים בהגנה — שילוב נכון מנצח</div>
    <div class="grid" id="playerGrid"></div>
    <div class="pick-count" id="pickCount">נבחרו 0 מתוך 5</div>
    <button class="primary" id="btnDraftNext" disabled>המשך לגביע</button>
  </div>

  <!-- SCREEN 3: bracket -->
  <div class="card hidden" id="screen-bracket">
    <h2 id="bracketTeamName">המסלול לגביע</h2>
    <div class="bracket" id="bracketList"></div>
    <button class="primary" id="btnPlayMatch">שרוק להתחלת המשחק</button>
  </div>

  <!-- SCREEN 4: match -->
  <div class="card hidden" id="screen-match">
    <div class="clock" id="roundLabel"></div>
    <div class="versus">
      <div class="side">
        <span class="crest" id="homeCrest">⚽</span>
        <div class="tname" id="homeName"></div>
      </div>
      <div class="score" id="scoreLine">0 - 0</div>
      <div class="side">
        <span class="crest" id="awayCrest">🛡️</span>
        <div class="tname" id="awayName"></div>
      </div>
    </div>
    <div class="clock" id="minuteLabel">לחץ על השריקה כדי להתחיל</div>

    <div class="pitch" id="pitch">
      <div class="goal-box left"></div>
      <div class="goal-box right"></div>
      <div class="center-line"></div>
      <div class="center-circle"></div>
      <div class="goal-text left" id="goalTextLeft">גול!</div>
      <div class="goal-text right" id="goalTextRight">גול!</div>
      <div class="ball" id="ball"></div>
      <!-- player dots injected by JS -->
    </div>

    <div class="commentary" id="commentary"></div>
    <div id="resultArea"></div>
    <button class="primary" id="btnContinue" style="display:none;">המשך</button>
  </div>

  <!-- SCREEN 5: trophy -->
  <div class="card hidden trophy-screen" id="screen-trophy">
    <div class="big">🏆</div>
    <h2 id="trophyTitle">אלופת גביע הרחוב!</h2>
    <p id="trophyText" class="subtitle"></p>
    <button class="primary" id="btnRestartWin">התחל טורניר חדש</button>
  </div>

</div>

<script>
/* ---------- data ---------- */
const PLAYERS = [
  {name:"ברק", pos:"חלוץ", emoji:"⚡", atk:5, def:1},
  {name:"הקיר", pos:"מגן", emoji:"🧱", atk:1, def:5},
  {name:"הקוסם", pos:"קישור", emoji:"🪄", atk:3, def:3},
  {name:"טיל", pos:"חלוץ", emoji:"🚀", atk:4, def:2},
  {name:"הצל", pos:"מגן", emoji:"🌑", atk:2, def:4},
  {name:"הנשר", pos:"קישור", emoji:"🦅", atk:4, def:3},
  {name:"רעם", pos:"חלוץ", emoji:"⛈️", atk:5, def:2},
  {name:"הסלע", pos:"מגן", emoji:"🪨", atk:1, def:5},
  {name:"הפנתר", pos:"קישור", emoji:"🐆", atk:3, def:4},
  {name:"הכוכב", pos:"חלוץ", emoji:"⭐", atk:4, def:1},
];

const OPPONENTS = [
  {name:"נמרי הצפון", emoji:"🐯", atk:2.2, def:2.0, roundLabel:"סיבוב 1"},
  {name:"ברקים כחולים", emoji:"🌩️", atk:2.7, def:2.5, roundLabel:"סיבוב 2"},
  {name:"האריות האדומים", emoji:"🦁", atk:3.1, def:2.9, roundLabel:"חצי גמר"},
  {name:"כוכבי הזהב", emoji:"🌟", atk:3.6, def:3.3, roundLabel:"הגמר הגדול"},
];

/* ---------- state ---------- */
let state = {
  teamName:"",
  selected:[],
  round:0, // index into OPPONENTS
};

const MY_DOT_POS = [
  {x:14, y:50}, {x:24, y:22}, {x:24, y:78}, {x:38, y:35}, {x:38, y:65}
];
const OPP_DOT_POS = [
  {x:86, y:50}, {x:76, y:22}, {x:76, y:78}, {x:62, y:35}, {x:62, y:65}
];

function renderPitchDots(){
  const pitch = $('pitch');
  pitch.querySelectorAll('.dot').forEach(d=>d.remove());
  const chosen = state.selected.map(i=>PLAYERS[i]);
  MY_DOT_POS.forEach((pos, i)=>{
    const p = chosen[i];
    const d = document.createElement('div');
    d.className = "dot mine";
    d.style.left = pos.x + "%";
    d.style.top = pos.y + "%";
    d.style.animationDelay = (i*0.3) + "s";
    d.textContent = p ? p.emoji : "⚽";
    d.dataset.role = "mine";
    pitch.appendChild(d);
  });
  OPP_DOT_POS.forEach((pos, i)=>{
    const d = document.createElement('div');
    d.className = "dot opp";
    d.style.left = pos.x + "%";
    d.style.top = pos.y + "%";
    d.style.animationDelay = (i*0.3) + "s";
    d.textContent = "🛡️";
    d.dataset.role = "opp";
    pitch.appendChild(d);
  });
}

function bounceRandomDot(role){
  const pitch = $('pitch');
  const dots = Array.from(pitch.querySelectorAll(`.dot[data-role="${role}"]`));
  if(dots.length === 0) return;
  const d = dots[Math.floor(Math.random()*dots.length)];
  d.classList.remove('bounce');
  void d.offsetWidth;
  d.classList.add('bounce');
}

function moveBall(xPercent, yPercent){
  const ball = $('ball');
  ball.style.left = xPercent + "%";
  ball.style.top = yPercent + "%";
}

function flashGoalText(side){
  const el = side === 'right' ? $('goalTextRight') : $('goalTextLeft');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 900);
}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function setRail(step){
  document.querySelectorAll('.rail-step').forEach((el,i)=>{
    el.classList.remove('done','current');
    if(i<step) el.classList.add('done');
    else if(i===step) el.classList.add('current');
  });
}

/* ---------- screen 1: name ---------- */
$('btnNameNext').addEventListener('click', ()=>{
  const val = $('teamName').value.trim();
  state.teamName = val || "הקבוצה שלי";
  hide('screen-name');
  renderDraft();
  show('screen-draft');
  setRail(1);
});

/* ---------- screen 2: draft ---------- */
function renderDraft(){
  const grid = $('playerGrid');
  grid.innerHTML = "";
  PLAYERS.forEach((p, idx)=>{
    const div = document.createElement('div');
    div.className = "player";
    div.dataset.idx = idx;
    div.innerHTML = `
      <span class="emoji">${p.emoji}</span>
      <div class="name">${p.name}</div>
      <div class="pos">${p.pos}</div>
      <div class="stat-row">
        <span class="stat atk">התקפה ${p.atk}</span>
        <span class="stat def">הגנה ${p.def}</span>
      </div>`;
    div.addEventListener('click', ()=>togglePlayer(idx, div));
    grid.appendChild(div);
  });
  updatePickCount();
}

function togglePlayer(idx, el){
  const pos = state.selected.indexOf(idx);
  if(pos >= 0){
    state.selected.splice(pos,1);
    el.classList.remove('selected');
  } else {
    if(state.selected.length >= 5) return;
    state.selected.push(idx);
    el.classList.add('selected');
  }
  updatePickCount();
}

function updatePickCount(){
  $('pickCount').textContent = `נבחרו ${state.selected.length} מתוך 5`;
  $('btnDraftNext').disabled = state.selected.length !== 5;
}

$('btnDraftNext').addEventListener('click', ()=>{
  hide('screen-draft');
  state.round = 0;
  renderBracket();
  show('screen-bracket');
  setRail(2);
});

/* ---------- team power ---------- */
function myPower(){
  const chosen = state.selected.map(i=>PLAYERS[i]);
  const atk = chosen.reduce((s,p)=>s+p.atk,0)/chosen.length;
  const def = chosen.reduce((s,p)=>s+p.def,0)/chosen.length;
  return {atk, def};
}

/* ---------- screen 3: bracket ---------- */
function renderBracket(){
  $('bracketTeamName').textContent = `המסלול של ${state.teamName}`;
  const list = $('bracketList');
  list.innerHTML = "";
  OPPONENTS.forEach((o, i)=>{
    const div = document.createElement('div');
    let cls = "bracket-item";
    let badge = "";
    if(i < state.round){ cls += " won"; badge = "✅"; }
    else if(i === state.round){ cls += " now"; badge = "▶️"; }
    else { badge = o.emoji; }
    div.className = cls;
    div.innerHTML = `
      <div class="num">${i+1}</div>
      <div class="info">
        <div class="team">${o.name} ${o.emoji}</div>
        <div class="round-label">${o.roundLabel}</div>
      </div>
      <div class="badge">${badge}</div>`;
    list.appendChild(div);
  });
  $('btnPlayMatch').textContent = state.round===0 ? "שרוק להתחלת המשחק" : "המשך למשחק הבא";
}

$('btnPlayMatch').addEventListener('click', ()=>{
  hide('screen-bracket');
  startMatch();
  show('screen-match');
  setRail(2);
});

/* ---------- screen 4: match simulation ---------- */
function goalsFor(atk, oppDef){
  const base = (atk - oppDef) * 0.6 + 1.4;
  const rand = Math.random()*2.6;
  return Math.max(0, Math.min(6, Math.round(base + rand)));
}

function startMatch(){
  const opp = OPPONENTS[state.round];
  const my = myPower();

  $('roundLabel').textContent = opp.roundLabel;
  $('homeCrest').textContent = "⚽";
  $('homeName').textContent = state.teamName;
  $('awayCrest').textContent = opp.emoji;
  $('awayName').textContent = opp.name;
  $('scoreLine').textContent = "0 - 0";
  $('minuteLabel').textContent = "לחץ על השריקה כדי להתחיל";
  $('commentary').innerHTML = "";
  $('resultArea').innerHTML = "";
  $('btnContinue').style.display = "none";
  renderPitchDots();
  moveBall(50, 50);

  const homeGoals = goalsFor(my.atk, opp.def);
  const awayGoals = goalsFor(opp.atk, my.def);

  // build minute-stamped events
  let events = [];
  for(let i=0;i<homeGoals;i++) events.push({team:'home', minute: 3+Math.floor(Math.random()*86)});
  for(let i=0;i<awayGoals;i++) events.push({team:'away', minute: 3+Math.floor(Math.random()*86)});
  events.sort((a,b)=>a.minute-b.minute);

  // whistle-to-start button reused as commentary trigger
  const whistleHandler = ()=>{
    $('minuteLabel').textContent = "המשחק החל!";
    addComment("🔔 השופט שורק, המשחק מתחיל!");
    playEvents(events, 0, 0, 0, opp);
  };
  // trigger automatically after short delay (feels like tapping "play match" already started it)
  setTimeout(whistleHandler, 400);
}

function addComment(text){
  const c = $('commentary');
  const div = document.createElement('div');
  div.textContent = text;
  c.prepend(div);
}

function playEvents(events, idx, homeScore, awayScore, opp){
  if(idx >= events.length){
    finishMatch(homeScore, awayScore, opp);
    return;
  }
  const ev = events[idx];
  const targetY = 30 + Math.random()*40;

  setTimeout(()=>{
    // ball runs toward the goal being attacked
    if(ev.team === 'home'){
      moveBall(90, targetY);
    } else {
      moveBall(10, targetY);
    }

    setTimeout(()=>{
      // ball arrives, goal happens
      if(ev.team === 'home'){
        homeScore++;
        addComment(`⚽ גול! ${state.teamName} כובשים בדקה ${ev.minute}'`);
        flashGoalText('right');
        bounceRandomDot('mine');
      } else {
        awayScore++;
        addComment(`⚽ גול ל${opp.name} בדקה ${ev.minute}'`);
        flashGoalText('left');
        bounceRandomDot('opp');
      }
      $('scoreLine').textContent = `${homeScore} - ${awayScore}`;
      $('scoreLine').classList.remove('goal-flash');
      void $('scoreLine').offsetWidth;
      $('scoreLine').classList.add('goal-flash');
      $('minuteLabel').textContent = `דקה ${ev.minute}'`;

      setTimeout(()=>{
        moveBall(50, 50);
        setTimeout(()=>{
          playEvents(events, idx+1, homeScore, awayScore, opp);
        }, 700);
      }, 700);
    }, 800);
  }, 300);
}

function finishMatch(homeScore, awayScore, opp){
  $('minuteLabel').textContent = "המשחק הסתיים";
  addComment("🏁 שריקת סיום!");

  if(homeScore === awayScore){
    addComment("⚖️ תיקו! עוברים לפנדלים...");
    setTimeout(()=>penaltyShootout(opp), 1000);
    return;
  }
  const won = homeScore > awayScore;
  showResult(won, opp);
}

function penaltyShootout(opp){
  addComment("🥅 סדרת פנדלים!");
  let myScore = 0, oppScore = 0;
  for(let i=0;i<3;i++){
    if(Math.random() < 0.65) myScore++;
    if(Math.random() < 0.65) oppScore++;
  }
  while(myScore === oppScore){
    if(Math.random() < 0.5) myScore++; else oppScore++;
  }
  addComment(`🥅 תוצאת הפנדלים: ${myScore} - ${oppScore}`);
  showResult(myScore > oppScore, opp);
}

function showResult(won, opp){
  const area = $('resultArea');
  if(won){
    area.innerHTML = `<div class="result-banner win">🎉 ${state.teamName} מנצחים את ${opp.name}!</div>`;
  } else {
    area.innerHTML = `<div class="result-banner lose">😔 ${opp.name} ניצחו הפעם</div>`;
  }
  const btn = $('btnContinue');
  btn.style.display = "block";
  btn.textContent = won ? "המשך בטורניר" : "נסה שוב מההתחלה";
  btn.onclick = ()=>{
    if(won){
      state.round++;
      hide('screen-match');
      if(state.round >= OPPONENTS.length){
        showTrophy();
      } else {
        renderBracket();
        show('screen-bracket');
      }
    } else {
      resetGame();
    }
  };
}

/* ---------- screen 5: trophy ---------- */
function showTrophy(){
  $('trophyText').textContent = `${state.teamName} ניצחו את כל היריבות והרימו את גביע הרחוב!`;
  show('screen-trophy');
  setRail(4);
  launchConfetti();
}

function launchConfetti(){
  const emojis = ["🎉","⚽","🏆","✨","🎊"];
  for(let i=0;i<24;i++){
    const el = document.createElement('div');
    el.className = "confetti";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDuration = (2 + Math.random()*1.5) + "s";
    el.style.fontSize = (14 + Math.random()*16) + "px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

$('btnRestartWin').addEventListener('click', resetGame);

function resetGame(){
  state = {teamName:"", selected:[], round:0};
  $('teamName').value = "";
  hide('screen-match');
  hide('screen-trophy');
  hide('screen-bracket');
  hide('screen-draft');
  show('screen-name');
  setRail(0);
}

setRail(0);
</script>
</body>
</html>
